# Build failures and local store problems.

id: build-failed
title: A build failed with a non-zero exit code
category: build
tags: [build, log]
match:
  - "builder"
match_all:
  - "failed with exit code"
cause: |
  The derivation's builder script stopped with an error. Nix prints only the
  tail of the log, which is rarely where the real error is. Older versions
  say `builder for '...drv' failed`, newer ones say
  `Cannot build '...drv'. Reason: builder failed with exit code N`.
fix: |
  Read the full log, not the tail:
    nix log /nix/store/<hash>-<name>.drv
  Then reproduce interactively:
    nix develop /nix/store/<hash>-<name>.drv
    # or, for a package you are writing:
    nix-shell -p <buildInputs> --run 'bash -x build.sh'
  The first `error:` in the log is the cause; everything after it is fallout.
  For `configure: error` and `No such file or directory` for a header, the
  fix is usually a missing `nativeBuildInputs` / `buildInputs` entry.

---
id: build-missing-header
title: Build cannot find a header or file
category: build
match:
  - "fatal error:"
match_all:
  - "no such file or directory"
cause: |
  The compiler or configure script cannot find a header (or a data file)
  that the build expects. In Nix, dependencies are not in `/usr/include`;
  they must be declared as build inputs.
fix: |
  Find the package that ships the header:
    nix-locate --top-level '*/include/foo.h'
  Add it to `buildInputs` (libraries) or `nativeBuildInputs` (tools, and
  anything needed by `configure`). For `pkg-config` lookups also set
  `PKG_CONFIG_PATH` via the `pkg-config` hook, which Nix sets up
  automatically when the package is in `nativeBuildInputs`.

---
id: build-pkgconfig
title: pkg-config cannot find a dependency
category: build
match:
  - "pkg-config search path"
  - "was not found in the pkg-config search path"
cause: |
  The build asks pkg-config for a `.pc` file that is not visible. In Nix
  this means the dependency is missing from `buildInputs`, or it is there
  but only in `nativeBuildInputs` / only for a different host platform.
fix: |
  Add the package that provides the `.pc` file to `buildInputs`. The error
  names the module (for example `openssl`), so `nix-locate '*/lib/pkgconfig/openssl.pc'`
  finds the right attribute. For `--static` builds, `pkg-config` may also
  need `PKG_CONFIG_ALLOW_SYSTEM_LIBS`.

---
id: store-hash-mismatch
title: Hash mismatch for downloaded content
category: store
tags: [hash, fetch, reproducibility]
match:
  - "hash mismatch"
cause: |
  The content Nix downloaded does not match the pinned hash. Either the
  upstream file changed under a mutable URL (branch, tag, "latest"), the
  hash was copied incorrectly, or a mirror served something different.
fix: |
  Get the correct hash:
    nix-prefetch-url https://example.com/file.tar.gz
    nix store prefetch-file https://example.com/file.tar.gz
  Paste it in place of the old value. If the URL points at a branch, pin a
  tag or a commit instead — otherwise the failure will repeat. For flakes
  run `nix flake update` to refresh `flake.lock`.

---
id: store-no-space
title: No space left on device
category: store
match:
  - "no space left on device"
cause: |
  The Nix store (or the filesystem holding it) is full. Generations, dev
  shells and old flake inputs are all kept until garbage collected.
fix: |
  Free space, keeping the current generation:
    nix-collect-garbage -d
    nh clean all --keep 3            # if you use nh
  Check what holds space with `nix-tree` or `nix-du`. You can also set
  `min-free` / `max-free` in /etc/nix/nix.conf so the daemon collects
  garbage automatically.

---
id: store-permission
title: Permission denied accessing the Nix store
category: store
match:
  - "opening lock file"
  - "cannot open connection to the remote store"
  - "/nix/store"
  - "/nix/var"
match_all:
  - "permission denied"
cause: |
  Either your user cannot talk to the daemon socket, or the store is owned
  by another user (common after switching between single-user and
  multi-user installs).
fix: |
  Check the daemon and the socket:
    systemctl status nix-daemon
    ls -l /nix/var/nix/daemon-socket/
  The socket must be writable by your user (or your user must be in the
  `nix-users` group; log out and back in after adding it). If files under
  /nix/store belong to another user, fix ownership with
  `sudo chown -R root:root /nix/store` — never make the store world-writable.

---
id: store-lock
title: The store is locked by another process
category: store
match:
  - "unable to lock path"
  - "cannot acquire lock"
cause: |
  Another Nix process holds a lock on the same store path — usually a build
  or a garbage collection running in parallel.
fix: |
  Wait for the other process, or find it with
  `ps aux | grep -E 'nix|garbage'`. If the process is gone but the lock
  remains, the daemon can be restarted (`sudo systemctl restart nix-daemon`);
  never delete lock files by hand while a build is running.

---
id: store-path-invalid
title: Not a valid store path
category: store
match:
  - "is not a valid store path"
cause: |
  A string that should name a store path does not have the expected
  `/nix/store/<32-character-hash>-<name>` shape. Usually a path was
  constructed by hand, or `toString` was applied to something that is not a
  derivation.
fix: |
  Use the derivation's `.outPath` / `.drvPath` instead of building the path
  from strings. In a shell, take the path from `nix build --print-out-paths`
  rather than guessing the hash.

---
id: build-configure-failed
title: configure script failed
category: build
match:
  - "configure: error:"
cause: |
  The package's `configure` script refused to continue. The line after
  `configure: error:` names the missing dependency, header or flag.
fix: |
  Read the specific message; it is usually accurate. Look at `config.log`
  in the build directory for the compiler test that failed
  (`nix log <drv>` keeps it). Add the missing package to `buildInputs` or
  `nativeBuildInputs`, or pass the right `configureFlags`.

---
id: build-undefined-reference
title: Linker cannot resolve a symbol
category: build
match:
  - "undefined reference to"
cause: |
  The linker saw a call to a symbol but no library providing it. In Nix this
  is almost always a library missing from `buildInputs`, or a `-l` flag that
  points at a library not on the link path.
fix: |
  Find the package that provides the symbol (`nix-locate --top-level
  '*libfoo.so*'`) and add it to `buildInputs`. If you set `LDFLAGS`
  manually, use `pkg-config --libs foo` instead of hardcoding `-lfoo`.

---
id: store-no-signature
title: Path has no valid signature
category: store
match:
  - "lacks a valid signature"
cause: |
  Nix refuses to import a store path from an untrusted binary cache because
  the signature does not match any key in `trusted-public-keys`.
fix: |
  Add the cache's public key to `trusted-public-keys` in /etc/nix/nix.conf,
  or remove the untrusted `substituters` entry. Disabling signature checks
  (`require-sigs = false`) works but lets anyone feed you binaries — only do
  it on a machine you fully control.
see_also:
  - https://nix.dev/manual/nix/latest/store/types/http-binary-cache-store

---
id: store-db-busy
title: The Nix database is busy
category: store
match:
  - "database is busy"
  - "database is locked"
cause: |
  Another Nix process holds the SQLite lock on the store database — usually a
  build or a garbage collection running in parallel.
fix: |
  Retry in a moment. If nothing else is running, look for a stuck process
  with `ps aux | grep nix` and restart the daemon
  (`sudo systemctl restart nix-daemon`). Do not delete database files.

---
id: store-corrupted
title: Store path is corrupted
category: store
match:
  - "is corrupted"
  - "corrupted file"
cause: |
  A file in the store does not match its expected hash, usually after an
  interrupted download, a full disk or a bad disk.
fix: |
  Verify and repair:
    sudo nix-store --verify --check-contents --repair
  If the path cannot be repaired, delete it and rebuild:
    nix-store --delete /nix/store/<path>
  Then check the disk with `btrfs scrub` / `smartctl` if it happens again.

---
id: store-pure-path
title: Path is not in the Nix store (pure evaluation)
category: store
match:
  - "is not in the nix store"
  - "in pure evaluation mode"
cause: |
  Pure evaluation mode (used by flakes and `nix eval --pure-eval`) forbids
  reading arbitrary paths from the filesystem, because the result would
  depend on the machine.
fix: |
  Add the file to the store (`nix store add-path ./file`) and reference the
  resulting path, make it a flake input, or use `--impure` for a one-off
  command. Configuration files that must be read at evaluation time should
  live in the flake.
