# Russian translations for rules/*.yaml.
# One YAML document per rule, keyed by id. Missing rules fall back to English.

id: eval-infinite-recursion
title: Бесконечная рекурсия при вычислении
cause: |
  Nix пытается вычислить значение через само себя. Чаще всего это опция,
  чьё значение ссылается на неё же (напрямую или через `config`), модуль,
  который косвенно импортирует сам себя, или `rec`-множество без базового
  случая.
fix: |
  Посмотрите на самый внутренний кадр с вашим файлом (блок ТРАССИРОВКА).
  Проверьте `foo = config.foo;`, `lib.mkIf`, условие которого читает ту же
  опцию, и цикл в `imports`. Замените самоссылку на значение или разделите
  определения через `lib.mkDefault` / `lib.mkForce`.

---
id: eval-undefined-variable
title: Неопределённая переменная
cause: |
  В Nix нет неявных глобальных имён. Каждое имя должно быть связано через
  `let`, аргумент функции, `rec` или `with`. Опечатка в имени даёт ту же
  ошибку.
fix: |
  Свяжите имя: `let foo = ...; in ...` или аргумент `{ foo }: ...`. Для
  пакетов добавьте `with pkgs;`, для библиотек — `lib.`. В `nix repl`
  команда `:l ./file.nix` покажет доступные имена.

---
id: eval-attribute-missing
title: В множестве нет атрибута
cause: |
  В attrset нет запрошенного ключа: опечатка, переименованный после
  обновления nixpkgs атрибут или неверный уровень вложенности.
fix: |
  Проверьте написание; Nix часто печатает «Did you mean ...?». Для пакетов
  используйте `nix search nixpkgs <имя>`, для опций — `nixos-option` или
  search.nixos.org/options. При override поможет `builtins.attrNames`.

---
id: eval-attribute-already-defined
title: Атрибут определён дважды
cause: |
  Один и тот же ключ встречается в множестве дважды, например
  `let x = 1; x = 2; in x`.
fix: |
  Уберите одно определение. Если нужно объединить множества, используйте
  оператор `//` или `lib.mergeAttrs`; в модулях — `lib.mkDefault` /
  `lib.mkForce` вместо повторения ключа.

---
id: eval-cannot-coerce
title: Значение нельзя привести к строке
cause: |
  Требуется строка, а передано множество или список: строковая
  интерполяция `"${...}"`, `toString` или `concatStringsSep`. Списки
  приводит только `toString`, множества — никогда.
fix: |
  Приводите явно: `builtins.toString`, `lib.concatStringsSep "," list`,
  `builtins.toJSON`, либо берите нужный атрибут (`x.name` вместо `x`).
example: |
  builtins.toString { a = 1; }        # ошибка
  builtins.toJSON { a = 1; }          # работает

---
id: eval-cannot-add
title: Нельзя сложить значения разных типов
cause: |
  `+` перегружен: числа складываются, строки и пути конкатенируются.
  Смешение типов — ошибка.
fix: |
  Приводите типы: `toString n`, `builtins.fromJSON`; для списков строк —
  `lib.concatStrings` / `lib.concatStringsSep`.

---
id: eval-expected-type
title: Неверный тип там, где ожидается множество, список или строка
cause: |
  Деструктуризация аргумента `{ a }: ...` принимает только attrset;
  `map` и `attrNames` — только список или множество. Вызов с другим типом
  даёт эту ошибку.
fix: |
  Оберните значение (`{ ... }` или `[ ... ]`) или измените сигнатуру
  функции. При ручном вызове `callPackage`-функции передавайте всё
  множество атрибутов, а не один аргумент.

---
id: eval-call-non-function
title: Попытка вызвать не-функцию
cause: |
  `f x` применено к множеству, списку или строке. Часто путают `pkgs.foo`
  (attrset, например `python3Packages`) с функцией.
fix: |
  Проверьте тип через `builtins.typeOf` в `nix repl`. Для множеств —
  `f.attr`, для списков — `builtins.elemAt`; для пакетов добавьте
  `.override` или `callPackage`.

---
id: eval-unexpected-argument
title: Функция вызвана с лишним аргументом
cause: |
  В шаблоне аргументов нет этого имени и нет `...`. Обычно лишний атрибут
  приходит через `callPackage`, `overrideAttrs` или модуль.
fix: |
  Уберите аргумент, добавьте его в шаблон или допишите `...`:
  `{ foo, bar, ... }:`. Помните, что `overrideAttrs` принимает предыдущие
  атрибуты, а не произвольное множество.

---
id: eval-missing-argument
title: Функция вызвана без обязательного аргумента
cause: |
  Аргумент объявлен без значения по умолчанию, а вызывающий его не передал.
  В `callPackage` это значит, что имени нет в наборе пакетов.
fix: |
  Передайте аргумент, добавьте пакет в inputs или задайте значение по
  умолчанию `{ foo ? null }:`. В `callPackage` проверьте, что имя
  аргумента совпадает с именем пакета.

---
id: eval-assertion-failed
title: Проверка assert не прошла
cause: |
  Условие в `assert условие; значение` ложно. В nixpkgs и модулях это чаще
  проверка лицензии, платформы или согласованности, а не ваш код.
fix: |
  Найдите в трассировке кадр с вашим файлом. Если assert из nixpkgs, кадры
  выше называют условие (например `allowUnfree`). Исправляйте условие, а
  не assert.

---
id: eval-syntax-error
title: Синтаксическая ошибка при разборе файла
cause: |
  Парсер остановился на указанной позиции, но настоящая ошибка обычно на
  несколько символов раньше: пропущена `;`, не сбалансированы скобки,
  `let` без `in`, `=` вместо `==`.
fix: |
  Откройте файл на указанной строке и посмотрите на конец предыдущей
  конструкции. `nixfmt` часто показывает место, а
  `nix-instantiate --parse file.nix` даёт короткое сообщение.

---
id: eval-abort
title: Вычисление прервано
cause: |
  `builtins.abort` или библиотека с ним остановила вычисление. В модулях
  это явная проверка согласованности, причина названа в сообщении выше
  трассировки.
fix: |
  Устраните условие из сообщения. Если текст пришёл из библиотеки, поиск
  по нему в её исходниках покажет, что именно ожидается.

---
id: eval-file-not-found
title: Файл или путь не найден
cause: |
  Путь, `import`, `callPackage` или `readFile` указывает на несуществующее.
  Во флейках это также бывает, когда файл не добавлен в git: флейк видит
  только отслеживаемые файлы.
fix: |
  Проверьте путь относительно файла, где он указан (`./foo` — относительно
  импортирующего). Для флейков сделайте `git add` новых файлов или
  собирайте через `nix build path:.`.

---
id: eval-cannot-to-json
title: Функцию нельзя преобразовать в JSON
cause: |
  `builtins.toJSON` получил функцию. Сериализовать можно только данные:
  множества, списки, строки, числа, булевы значения и `null`.
fix: |
  Передавайте результат функции, а не саму функцию: `toJSON (f x)`.
  Если значение пришло из опции, убедитесь, что там значение, а не функция.

---
id: module-option-not-exist
title: Опции не существует
cause: |
  Имя опции с опечаткой или переименовано, модуль с ней не импортирован,
  либо значение положено в `config` для опции, объявленной в `options`.
fix: |
  Ищите опцию на search.nixos.org/options (для home-manager —
  home-manager-options.extranix.com). Импортируйте нужный модуль. Подсказка
  про `config`/`options` означает, что вы объявляете опцию там, где её
  нужно задавать.

---
id: module-type-mismatch
title: У опции неверный тип значения
cause: |
  Значение не соответствует объявленному типу: строка вместо числа, одно
  значение вместо списка, множество вместо строки.
fix: |
  Ожидаемый тип указан в сообщении. Приводите значение: списки в `[ ... ]`,
  булевы — `true` / `false` без кавычек. Сверьтесь с документацией опции.

---
id: module-conflict
title: Конфликтующие определения опции
cause: |
  Два модуля или два места в одном файле задают одну опцию разными
  значениями с одинаковым приоритетом.
fix: |
  Оставьте одно определение либо разрешите приоритет: `lib.mkDefault`
  (ниже), `lib.mkForce` (выше), `mkBefore` / `mkAfter` для списков.
  Сообщение перечисляет файлы — начните с них.

---
id: module-no-value
title: Опция используется, но не задана
cause: |
  Опцию читают, но никто не задаёт её, и у объявления нет значения по
  умолчанию. Часто включён сервис без обязательной подопции или не
  импортирован модуль, задающий `default`.
fix: |
  Задайте опцию явно, импортируйте модуль с `default` или читайте её
  лениво (`config.<opt>` только когда нужно), а не форсируйте при
  вычислении.

---
id: module-unsupported-attribute
title: В модуле неподдерживаемый атрибут
cause: |
  Модуль вернул атрибут, которого модульная система не понимает. Обычно
  опечатка в верхнем уровне (`import` вместо `imports`) или значение лежит
  прямо в модуле, а не в `config`.
fix: |
  Перенесите атрибут в `config` или `options`, проверьте написание
  `imports`, `config`, `options`, `_module`. В сообщении указан файл
  модуля, вернувшего лишний атрибут.

---
id: hm-file-collision
title: Конфликт файлов Home Manager
cause: |
  Home Manager хочет создать файл, который уже есть на диске и создан не
  им. Молча перезаписывать он отказывается.
fix: |
  Удалите или переместите существующий файл и повторите
  `home-manager switch`. Для автоматического бэкапа задайте
  `home-manager.backupFileExtension = "backup";`. `force = true`
  применяйте только к файлам, которыми Home Manager должен владеть.

---
id: pkg-unfree
title: У пакета несвободная лицензия
cause: |
  nixpkgs по умолчанию отказывается вычислять пакеты с несвободной
  лицензией. Это проверка политики, а не ошибка сборки: ничего не
  скачивается.
fix: |
  Включите глобально `nixpkgs.config.allowUnfree = true;` или на одну
  команду `NIXPKGS_ALLOW_UNFREE=1 nix build --impure .#foo`. Для одного
  пакета лучше `allowUnfreePredicate`, остальные останутся свободными.

---
id: pkg-broken
title: Пакет помечен как сломанный
cause: |
  Метаданные говорят, что пакет не собирается на этой платформе или с этой
  ревизией nixpkgs. Пометку ставит тот, кто последним увидел падение.
fix: |
  Выберите другой пакет или зафиксируйте более старый nixpkgs. Можно
  разрешить локально (`allowBroken` или `NIXPKGS_ALLOW_BROKEN=1` с
  `--impure`), но сборка, скорее всего, упадёт.

---
id: pkg-insecure
title: Пакет помечен как небезопасный
cause: |
  У пакета известная уязвимость, он заблокирован по умолчанию; сообщение
  обычно называет CVE.
fix: |
  Сначала обновите nixpkgs — исправление может уже быть доступно. Если
  пакет нужен, разрешите его точечно (`allowInsecurePredicate` или
  `NIXPKGS_ALLOW_INSECURE=1` с `--impure`).

---
id: pkg-unsupported-platform
title: Пакет недоступен для этой платформы
cause: |
  `meta.platforms` не включает вашу систему, или запрошенная система не
  совпадает с машиной сборки.
fix: |
  Посмотрите `nix eval nixpkgs#foo.meta.platforms`. Возьмите
  поддерживаемый пакет либо задайте `allowUnsupportedSystem = true`, если
  готовы рискнуть. Для кросс-сборки укажите `system` явно.

---
id: pkg-collision
title: Коллизия двух путей в store
cause: |
  Две деривации хотят произвести разное содержимое по одному пути. Обычно
  это fixed-output derivation (`fetchurl`, `fetchFromGitHub`), у которой
  изменилось содержимое, или смешаны источники с одинаковым хешем.
fix: |
  Удалите устаревший путь (`nix-store --delete /nix/store/<path>`) и
  пересоберите. Если содержимое действительно изменилось, обновите хеш
  через `nix-prefetch-url` / `nix store prefetch-file`.

---
id: build-failed
title: Сборка завершилась с ненулевым кодом
cause: |
  Скрипт сборки деривации упал. Nix печатает только хвост лога, где
  настоящей ошибки обычно нет. Старые версии пишут `builder for ... failed`,
  новые — `Cannot build ... Reason: builder failed with exit code N`.
fix: |
  Читайте полный лог: `nix log /nix/store/<hash>-<name>.drv`. Воспроизведите
  интерактивно через `nix develop <drv>`. Первый `error:` в логе — причина,
  остальное следствие. Для `configure: error` и отсутствующих заголовков
  обычно не хватает `nativeBuildInputs` / `buildInputs`.

---
id: build-missing-header
title: Сборка не находит заголовок или файл
cause: |
  Компилятор или `configure` не находит заголовок (или файл данных).
  В Nix зависимости не лежат в `/usr/include` — их нужно объявить.
fix: |
  Найдите пакет с заголовком (`nix-locate --top-level '*/include/foo.h'`) и
  добавьте в `buildInputs` (библиотеки) или `nativeBuildInputs`
  (инструменты). Для `pkg-config` достаточно положить пакет в
  `nativeBuildInputs`.

---
id: build-pkgconfig
title: pkg-config не находит зависимость
cause: |
  Сборка запрашивает `.pc`-файл, которого не видно. В Nix это значит, что
  зависимость не в `buildInputs` или лежит только в `nativeBuildInputs`.
fix: |
  Добавьте пакет с `.pc`-файлом в `buildInputs`. Модуль назван в ошибке;
  `nix-locate '*/lib/pkgconfig/openssl.pc'` найдёт атрибут. Для статических
  сборок может понадобиться `PKG_CONFIG_ALLOW_SYSTEM_LIBS`.

---
id: store-hash-mismatch
title: Несовпадение хеша скачанного содержимого
cause: |
  Содержимое не совпало с закреплённым хешем: upstream изменил файл по
  изменяемому URL (ветка, тег, latest), хеш скопирован неверно или зеркало
  отдало другое.
fix: |
  Получите правильный хеш: `nix-prefetch-url <url>` или
  `nix store prefetch-file <url>`. Если URL указывает на ветку, закрепите
  тег или коммит. Для флейков — `nix flake update`.

---
id: store-no-space
title: На диске не осталось места
cause: |
  Store или файловая система с ним заполнены. Генерации, devshell-ы и
  старые входы флейков хранятся до сборки мусора.
fix: |
  Освободите место, сохранив текущую генерацию: `nix-collect-garbage -d`
  или `nh clean all --keep 3`. Посмотрите, что занимает место, через
  `nix-tree` / `nix-du`. Можно задать `min-free` / `max-free` в
  `/etc/nix/nix.conf`.

---
id: store-permission
title: Нет доступа к Nix store
cause: |
  Пользователь не может обратиться к сокету демона, или store принадлежит
  другому пользователю (часто после перехода между single-user и
  multi-user установкой).
fix: |
  Проверьте `systemctl status nix-daemon` и права на
  `/nix/var/nix/daemon-socket/`. Сокет должен быть доступен вашему
  пользователю (или добавьте его в группу `nix-users` и перелогиньтесь).
  Владельца store исправляйте через `sudo chown -R root:root /nix/store`,
  но не делайте store доступным на запись всем.

---
id: store-lock
title: Store заблокирован другим процессом
cause: |
  Другой процесс Nix держит блокировку того же пути — обычно параллельная
  сборка или сборка мусора.
fix: |
  Дождитесь процесса или найдите его через `ps aux | grep -E 'nix|garbage'`.
  Если процесс завершился, а блокировка осталась, перезапустите демон
  (`sudo systemctl restart nix-daemon`). Не удаляйте lock-файлы вручную во
  время сборки.

---
id: store-path-invalid
title: Некорректный путь в store
cause: |
  Строка, которая должна быть путём store, не имеет вида
  `/nix/store/<32-символьный-хеш>-<имя>`. Обычно путь собран вручную или
  `toString` применён не к деривации.
fix: |
  Используйте `.outPath` / `.drvPath` деривации вместо конструирования
  строки. В shell берите путь из `nix build --print-out-paths`, а не
  угадывайте хеш.

---
id: build-configure-failed
title: Скрипт configure завершился ошибкой
cause: |
  `configure` отказался продолжать. Строка после `configure: error:`
  называет отсутствующую зависимость, заголовок или флаг.
fix: |
  Читайте конкретное сообщение — оно обычно точное. В build-каталоге
  смотрите `config.log` (`nix log <drv>` его сохраняет). Добавьте пакет в
  `buildInputs` / `nativeBuildInputs` или передайте нужные
  `configureFlags`.

---
id: build-undefined-reference
title: Линкер не находит символ
cause: |
  Есть вызов символа, но нет библиотеки, которая его предоставляет.
  В Nix это почти всегда библиотека, забытая в `buildInputs`, или `-l` для
  библиотеки вне пути поиска.
fix: |
  Найдите пакет с символом (`nix-locate --top-level '*libfoo.so*'`) и
  добавьте в `buildInputs`. Вместо ручного `-lfoo` в `LDFLAGS`
  используйте `pkg-config --libs foo`.

---
id: store-no-signature
title: У пути нет действительной подписи
cause: |
  Nix отказывается импортировать путь из недоверенного бинарного кэша:
  подпись не совпадает ни с одним ключом из `trusted-public-keys`.
fix: |
  Добавьте публичный ключ кэша в `trusted-public-keys` в
  `/etc/nix/nix.conf` или уберите недоверенный `substituters`. Отключение
  проверки подписей (`require-sigs = false`) работает, но позволяет
  подсунуть любые бинарники — только для полностью контролируемой машины.

---
id: store-db-busy
title: База данных Nix занята
cause: |
  Другой процесс Nix держит блокировку SQLite на базе store — обычно
  параллельная сборка или сборка мусора.
fix: |
  Повторите через минуту. Если ничего не запущено, найдите зависший
  процесс (`ps aux | grep nix`) и перезапустите демон. Не удаляйте файлы
  базы.

---
id: store-corrupted
title: Путь в store повреждён
cause: |
  Файл в store не совпадает с ожидаемым хешем — обычно после прерванной
  загрузки, заполненного диска или сбоя диска.
fix: |
  Проверьте и восстановите:
  `sudo nix-store --verify --check-contents --repair`. Если путь не
  восстанавливается, удалите его и пересоберите:
  `nix-store --delete /nix/store/<path>`. Если повторяется, проверьте диск
  (`btrfs scrub`, `smartctl`).

---
id: store-pure-path
title: Путь вне store в чистом режиме вычисления
cause: |
  Чистый режим (флейки, `nix eval --pure-eval`) запрещает читать
  произвольные пути из файловой системы: результат зависел бы от машины.
fix: |
  Добавьте файл в store (`nix store add-path ./file`) и ссылайтесь на
  полученный путь, сделайте его входом флейка или используйте `--impure`
  для разовой команды. Конфиги, нужные при вычислении, должны жить во
  флейке.

---
id: flake-feature-disabled
title: Флейки или nix-command отключены
cause: |
  В этой установке Nix не включены экспериментальные возможности, дающие
  `nix build`, `nix flake` и остальной новый CLI.
fix: |
  Добавьте в `/etc/nix/nix.conf` (или `~/.config/nix/nix.conf`):
  `experimental-features = nix-command flakes`, затем перезапустите демон.
  На одну команду:
  `nix --extra-experimental-features 'nix-command flakes' build .#foo`.

---
id: flake-attribute-missing
title: Флейк не предоставляет запрошенный атрибут
cause: |
  Флейк вычислился, но у него нет такого выхода для вашей системы: обычно
  есть `packages.x86_64-linux.default`, а запрошено другое имя или другая
  система, либо атрибут лежит в `legacyPackages`.
fix: |
  Посмотрите выходы: `nix flake show` или
  `nix flake show --json | jq 'keys'`. Используйте существующее имя,
  правильный `--system` или добавьте выход в `flake.nix`.

---
id: flake-not-a-flake
title: Каталог не является флейком
cause: |
  Путь обработан как флейк, но `flake.nix` отсутствует или не виден,
  потому что не отслеживается git.
fix: |
  Добавьте `flake.nix` (`nix flake init`) или используйте путь как обычный
  файл (`nix build -f ./default.nix`). Если файл есть, но не в git —
  `git add flake.nix`.

---
id: flake-dirty-tree
title: Рабочее дерево git грязное
cause: |
  Флейк лежит в git-репозитории с незакоммиченными изменениями; сборка уже
  не соответствует ни одному коммиту.
fix: |
  Закоммитьте или спрячьте изменения (`git add -A && git commit`), либо
  собирайте рабочее дерево явно: `nix build path:.`. В CI убедитесь, что
  checkout не оставляет сгенерированных файлов.

---
id: network-download-failed
title: Не удаётся скачать из кэша или по URL
cause: |
  Nix не достучался до substituter или URL: нет сети, проблемы DNS, прокси,
  корпоративный TLS-сертификат или недоступный кэш.
fix: |
  Проверьте URL через `curl -I`. За прокси задайте `http_proxy` /
  `https_proxy` для демона (systemd drop-in), для TLS —
  `NIX_SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt`. Чтобы обойтись
  без сети, повторите с `--offline`.

---
id: nix-daemon-connection
title: Нет соединения с демоном Nix
cause: |
  Клиент общается с `nix-daemon` через Unix-сокет, а демон не запущен или
  сокет недоступен (контейнер, chroot, неверный `NIX_REMOTE`).
fix: |
  Запустите и проверьте:
  `sudo systemctl enable --now nix-daemon.socket`,
  `systemctl status nix-daemon`. В контейнере может понадобиться
  `NIX_REMOTE=daemon` с примонтированным сокетом или single-user установка.

---
id: nix-untrusted-user
title: Пользователь не является доверенным
cause: |
  Демон отказывает в настройке, которую могут менять только доверенные
  пользователи: `substituters`, `sandbox`, `trusted-public-keys`.
fix: |
  Добавьте пользователя в `trusted-users` в `/etc/nix/nix.conf`
  (`trusted-users = root arch`) и перезапустите демон. Доверяйте только
  своим аккаунтам: доверенный пользователь может собирать с повышенными
  правами.

---
id: flake-lock-out-of-date
title: flake.lock устарел
cause: |
  `flake.nix` объявляет входы, которых нет в `flake.lock`, или lock-файл
  записан другой версией Nix.
fix: |
  Обновите lock: `nix flake lock` (добавить недостающие входы) или
  `nix flake update` (обновить все). Коммитьте `flake.lock` вместе с
  `flake.nix`, чтобы машины получали одинаковые ревизии.

---
id: flake-not-git-repo
title: Каталог не является git-репозиторием
cause: |
  У фетчера запросили git-ревизию (или флейк использует `self` как путь),
  а в каталоге нет `.git`.
fix: |
  Выполните `git init && git add -A && git commit` или собирайте как
  обычный путь (`nix build path:.`). Удалённые входы `git+file://` тоже
  требуют хотя бы одного коммита.

---
id: nixos-activation-failed
title: Скрипт активации завершился ошибкой
cause: |
  Новая система собрана, но фаза активации упала: не создан
  пользователь/группа, не перемещён файл, не перезагружен юнит. Упавшая
  команда напечатана выше.
fix: |
  Прочитайте строки перед ошибкой, исправьте причину и повторите
  `nixos-rebuild switch`. Если система в половинчатом состоянии, загрузите
  предыдущую генерацию или выполните `nixos-rebuild switch --rollback`.

---
id: systemd-unit-failed
title: Юнит systemd упал при переключении
cause: |
  Юнит, запущенный или перезапущенный новой конфигурацией, завершился с
  ненулевым кодом. Часто после изменения настроек сервиса или когда нужного
  каталога/пользователя ещё нет.
fix: |
  Смотрите юнит, а не вывод rebuild: `systemctl status <unit>` и
  `journalctl -u <unit> -b --no-pager`. Исправьте конфигурацию и
  переключитесь снова; устаревшее состояние сбрасывается
  `systemctl reset-failed <unit>`.
